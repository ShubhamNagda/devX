<svg
  width="1920"
  height="1080"
  viewBox="0 0 1920 1080"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- Main background -->
    <linearGradient id="background" x1="0" y1="0" x2="1920" y2="1080">
      <stop offset="0%" stop-color="#050507"/>
      <stop offset="35%" stop-color="#100817"/>
      <stop offset="70%" stop-color="#09050D"/>
      <stop offset="100%" stop-color="#030305"/>
    </linearGradient>

    <!-- Purple glow -->
    <radialGradient id="purpleGlow">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="75%" stop-color="#4C1D95" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Orange glow -->
    <radialGradient id="orangeGlow">
      <stop offset="0%" stop-color="#FFB347" stop-opacity="1"/>
      <stop offset="30%" stop-color="#FF7A18" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#EA580C" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Pink/purple glow -->
    <radialGradient id="pinkGlow">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.7"/>
      <stop offset="45%" stop-color="#9333EA" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Orange liquid -->
    <linearGradient id="orangeLiquid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB347" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#F97316" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7C2D12" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Purple liquid -->
    <linearGradient id="purpleLiquid" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.7"/>
      <stop offset="45%" stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2E1065" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Blur -->
    <filter id="blur80" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>

    <filter id="blur45" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>

    <!-- Glass distortion -->
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <!-- Subtle grain -->
    <filter id="noise">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.8"
        numOctaves="3"
        stitchTiles="stitch"
      />
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.035"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- Base -->
  <rect width="1920" height="1080" fill="url(#background)"/>

  <!-- PURPLE LIGHT - top right -->
  <ellipse
    cx="1580"
    cy="150"
    rx="520"
    ry="420"
    fill="url(#purpleGlow)"
    filter="url(#blur80)"
  />

  <!-- ORANGE LIGHT - bottom left -->
  <ellipse
    cx="300"
    cy="850"
    rx="500"
    ry="400"
    fill="url(#orangeGlow)"
    filter="url(#blur80)"
  />

  <!-- PINK LIGHT - center -->
  <ellipse
    cx="950"
    cy="450"
    rx="430"
    ry="350"
    fill="url(#pinkGlow)"
    filter="url(#blur80)"
  />

  <!-- Purple liquid blob -->
  <path
    d="
      M1450 40
      C1610 -80 1850 40 1920 180
      C1980 310 1840 420 1690 390
      C1540 360 1440 250 1400 160
      C1370 100 1400 70 1450 40Z
    "
    fill="url(#purpleLiquid)"
    filter="url(#blur45)"
  />

  <!-- Orange liquid blob -->
  <path
    d="
      M0 760
      C120 650 280 620 420 700
      C570 785 570 950 470 1050
      C360 1150 100 1120 0 1030
      Z
    "
    fill="url(#orangeLiquid)"
    filter="url(#blur45)"
  />

  <!-- Floating orange orb -->
  <circle
    cx="520"
    cy="260"
    r="150"
    fill="url(#orangeGlow)"
    filter="url(#blur45)"
  />

  <!-- Floating purple orb -->
  <circle
    cx="1220"
    cy="850"
    r="210"
    fill="url(#purpleGlow)"
    filter="url(#blur45)"
  />

  <!-- Liquid ribbon -->
  <path
    d="
      M-100 540
      C220 350 390 680 680 510
      C920 370 1060 210 1300 330
      C1510 440 1640 680 2020 470
    "
    stroke="url(#purpleLiquid)"
    stroke-width="150"
    stroke-linecap="round"
    opacity="0.25"
    filter="url(#blur45)"
  />

  <!-- Orange ribbon -->
  <path
    d="
      M-100 900
      C260 760 450 920 720 820
      C950 735 1080 580 1300 650
      C1510 720 1710 900 2020 720
    "
    stroke="url(#orangeLiquid)"
    stroke-width="100"
    stroke-linecap="round"
    opacity="0.18"
    filter="url(#blur45)"
  />

  <!-- Small bright highlights -->
  <circle
    cx="1680"
    cy="250"
    r="35"
    fill="#D8B4FE"
    opacity="0.55"
    filter="url(#softBlur)"
  />

  <circle
    cx="350"
    cy="760"
    r="28"
    fill="#FDBA74"
    opacity="0.65"
    filter="url(#softBlur)"
  />

  <circle
    cx="1080"
    cy="180"
    r="20"
    fill="#FFFFFF"
    opacity="0.35"
    filter="url(#softBlur)"
  />

  <!-- Very subtle grain -->
  <rect
    width="1920"
    height="1080"
    filter="url(#noise)"
    opacity="0.6"
  />
</svg>