<svg
  width="1920"
  height="1080"
  viewBox="0 0 1920 1080"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>

    <!-- Deep ocean background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1920" y2="1080">
      <stop offset="0%" stop-color="#003B88"/>
      <stop offset="35%" stop-color="#0078D4"/>
      <stop offset="70%" stop-color="#00A8E8"/>
      <stop offset="100%" stop-color="#004B9B"/>
    </linearGradient>

    <!-- Cyan glow -->
    <radialGradient id="cyanGlow">
      <stop offset="0%" stop-color="#B8F7FF" stop-opacity="0.65"/>
      <stop offset="45%" stop-color="#4DDBFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00A8E8" stop-opacity="0"/>
    </radialGradient>

    <!-- White glow -->
    <radialGradient id="whiteGlow">
      <stop offset="0%" stop-color="white" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>

    <!-- Wave gradient -->
    <linearGradient id="wave1" x1="0" y1="400" x2="1920" y2="900">
      <stop offset="0%" stop-color="#8CF3FF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0.22"/>
    </linearGradient>

    <linearGradient id="wave2" x1="0" y1="700" x2="1920" y2="500">
      <stop offset="0%" stop-color="#0052A8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#00C8F5" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#003D87" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Blur -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="45"/>
    </filter>

    <filter id="smallBlur">
      <feGaussianBlur stdDeviation="15"/>
    </filter>

  </defs>

  <!-- Main background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Large underwater glow -->
  <ellipse
    cx="350"
    cy="250"
    rx="500"
    ry="400"
    fill="url(#cyanGlow)"
    filter="url(#blur)"
  />

  <ellipse
    cx="1650"
    cy="850"
    rx="500"
    ry="350"
    fill="url(#cyanGlow)"
    filter="url(#blur)"
  />

  <!-- Central soft light -->
  <ellipse
    cx="960"
    cy="430"
    rx="350"
    ry="230"
    fill="url(#whiteGlow)"
    filter="url(#blur)"
  />

  <!-- Main flowing wave -->
  <path
    d="
      M-100 430
      C180 280 420 300 700 450
      C950 585 1130 650 1390 510
      C1620 385 1790 350 2020 460
      L2020 850
      C1780 750 1600 730 1370 850
      C1110 985 900 900 650 770
      C370 625 160 610 -100 730
      Z
    "
    fill="url(#wave1)"
  />

  <!-- Second flowing wave -->
  <path
    d="
      M-100 700
      C180 570 400 600 660 740
      C920 880 1130 900 1370 760
      C1600 625 1800 610 2020 720
      L2020 1080
      L-100 1080
      Z
    "
    fill="url(#wave2)"
  />

  <!-- Thin water stream -->
  <path
    d="
      M-80 470
      C220 315 450 345 720 490
      C970 625 1160 675 1410 535
      C1630 410 1800 390 2000 485
    "
    stroke="#D9FBFF"
    stroke-opacity="0.35"
    stroke-width="6"
    fill="none"
  />

  <path
    d="
      M-80 490
      C220 335 450 365 720 510
      C970 645 1160 695 1410 555
      C1630 430 1800 410 2000 505
    "
    stroke="#FFFFFF"
    stroke-opacity="0.12"
    stroke-width="3"
    fill="none"
  />

  <!-- Left light reflection -->
  <path
    d="
      M0 150
      C280 50 480 90 650 190
      C470 170 280 200 0 320
      Z
    "
    fill="#9AF4FF"
    fill-opacity="0.12"
  />

  <!-- Right light reflection -->
  <path
    d="
      M1920 160
      C1700 80 1500 130 1320 260
      C1540 190 1740 210 1920 300
      Z
    "
    fill="#FFFFFF"
    fill-opacity="0.1"
  />

  <!-- Bubbles -->
  <g>

    <circle
      cx="180"
      cy="570"
      r="25"
      fill="#B8F7FF"
      fill-opacity="0.08"
      stroke="#D9FBFF"
      stroke-opacity="0.35"
      stroke-width="2"
    />

    <circle
      cx="250"
      cy="480"
      r="11"
      fill="#FFFFFF"
      fill-opacity="0.18"
    />

    <circle
      cx="420"
      cy="730"
      r="17"
      fill="#B8F7FF"
      fill-opacity="0.1"
      stroke="#FFFFFF"
      stroke-opacity="0.25"
      stroke-width="2"
    />

    <circle
      cx="1640"
      cy="350"
      r="30"
      fill="#B8F7FF"
      fill-opacity="0.08"
      stroke="#D9FBFF"
      stroke-opacity="0.3"
      stroke-width="2"
    />

    <circle
      cx="1740"
      cy="450"
      r="12"
      fill="#FFFFFF"
      fill-opacity="0.18"
    />

    <circle
      cx="1510"
      cy="650"
      r="20"
      fill="#B8F7FF"
      fill-opacity="0.08"
      stroke="#FFFFFF"
      stroke-opacity="0.25"
      stroke-width="2"
    />

    <circle
      cx="1810"
      cy="760"
      r="9"
      fill="#FFFFFF"
      fill-opacity="0.2"
    />

  </g>

  <!-- Small particles -->
  <g fill="#DDFBFF" fill-opacity="0.5">
    <circle cx="120" cy="260" r="3"/>
    <circle cx="340" cy="360" r="4"/>
    <circle cx="540" cy="180" r="3"/>
    <circle cx="720" cy="800" r="4"/>
    <circle cx="900" cy="280" r="3"/>
    <circle cx="1100" cy="760" r="4"/>
    <circle cx="1260" cy="330" r="3"/>
    <circle cx="1440" cy="180" r="4"/>
    <circle cx="1580" cy="540" r="3"/>
    <circle cx="1810" cy="300" r="4"/>
    <circle cx="1870" cy="900" r="3"/>
  </g>

  <!-- Bottom ocean depth -->
  <rect
    y="900"
    width="1920"
    height="180"
    fill="#002E70"
    fill-opacity="0.2"
  />

</svg>