<svg
  width="1920"
  height="1080"
  viewBox="0 0 1920 1080"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>

    <!-- Sky -->
    <linearGradient
      id="sky"
      x1="0"
      y1="0"
      x2="1920"
      y2="1080"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#B9E8FF"/>
      <stop offset="0.45" stop-color="#EAF8FF"/>
      <stop offset="1" stop-color="#A9DFFF"/>
    </linearGradient>

    <!-- Cloud -->
    <linearGradient
      id="cloud"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#D7F1FF" stop-opacity="0.38"/>
    </linearGradient>

    <!-- Glass blue -->
    <linearGradient
      id="glass"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#7DD3FC" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0284C7" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Bubble -->
    <radialGradient id="bubble">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#BAE6FD" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0.04"/>
    </radialGradient>

    <!-- Blue glow -->
    <radialGradient id="glow">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="35"/>
    </filter>

    <filter id="cloudBlur">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

  </defs>

  <!-- ================================= -->
  <!-- SKY BACKGROUND -->
  <!-- ================================= -->

  <rect
    width="1920"
    height="1080"
    fill="url(#sky)"
  />

  <!-- Soft corner atmosphere -->

  <ellipse
    cx="0"
    cy="0"
    rx="500"
    ry="400"
    fill="url(#glow)"
    filter="url(#blur)"
  />

  <ellipse
    cx="1920"
    cy="1080"
    rx="550"
    ry="400"
    fill="url(#glow)"
    filter="url(#blur)"
  />


  <!-- ================================= -->
  <!-- LARGE CLOUD — TOP LEFT -->
  <!-- ================================= -->

  <g opacity="0.82">

    <circle
      cx="150"
      cy="150"
      r="65"
      fill="url(#cloud)"
      filter="url(#cloudBlur)"
    />

    <circle
      cx="230"
      cy="125"
      r="90"
      fill="url(#cloud)"
      filter="url(#cloudBlur)"
    />

    <circle
      cx="330"
      cy="165"
      r="60"
      fill="url(#cloud)"
      filter="url(#cloudBlur)"
    />

    <rect
      x="100"
      y="160"
      width="290"
      height="75"
      rx="37"
      fill="url(#cloud)"
    />

  </g>


  <!-- ================================= -->
  <!-- CLOUD — TOP RIGHT -->
  <!-- ================================= -->

  <g opacity="0.65">

    <circle
      cx="1650"
      cy="150"
      r="55"
      fill="url(#cloud)"
    />

    <circle
      cx="1725"
      cy="120"
      r="85"
      fill="url(#cloud)"
    />

    <circle
      cx="1820"
      cy="165"
      r="62"
      fill="url(#cloud)"
    />

    <rect
      x="1600"
      y="165"
      width="290"
      height="70"
      rx="35"
      fill="url(#cloud)"
    />

  </g>


  <!-- ================================= -->
  <!-- CLOUD — BOTTOM RIGHT -->
  <!-- ================================= -->

  <g opacity="0.50">

    <circle
      cx="1630"
      cy="920"
      r="60"
      fill="url(#cloud)"
    />

    <circle
      cx="1710"
      cy="880"
      r="95"
      fill="url(#cloud)"
    />

    <circle
      cx="1820"
      cy="930"
      r="65"
      fill="url(#cloud)"
    />

    <rect
      x="1580"
      y="930"
      width="310"
      height="70"
      rx="35"
      fill="url(#cloud)"
    />

  </g>


  <!-- ================================= -->
  <!-- FLOATING GLASS ORBS -->
  <!-- ================================= -->

  <g>

    <!-- Large orb -->
    <circle
      cx="480"
      cy="170"
      r="48"
      fill="url(#bubble)"
      stroke="#FFFFFF"
      stroke-opacity="0.35"
      stroke-width="2"
    />

    <circle
      cx="465"
      cy="153"
      r="10"
      fill="#FFFFFF"
      fill-opacity="0.45"
    />

    <!-- Medium orb -->
    <circle
      cx="1480"
      cy="310"
      r="32"
      fill="url(#bubble)"
      stroke="#FFFFFF"
      stroke-opacity="0.35"
      stroke-width="2"
    />

    <circle
      cx="1470"
      cy="300"
      r="7"
      fill="#FFFFFF"
      fill-opacity="0.45"
    />

    <!-- Bottom orb -->
    <circle
      cx="350"
      cy="900"
      r="42"
      fill="url(#bubble)"
      stroke="#FFFFFF"
      stroke-opacity="0.3"
      stroke-width="2"
    />

  </g>


  <!-- ================================= -->
  <!-- FLOATING GLASS DIAMONDS -->
  <!-- ================================= -->

  <g
    fill="url(#glass)"
    stroke="#FFFFFF"
    stroke-opacity="0.30"
    stroke-width="2"
  >

    <rect
      x="570"
      y="780"
      width="70"
      height="70"
      rx="16"
      transform="rotate(25 570 780)"
    />

    <rect
      x="1420"
      y="700"
      width="55"
      height="55"
      rx="14"
      transform="rotate(35 1420 700)"
    />

    <rect
      x="175"
      y="480"
      width="45"
      height="45"
      rx="10"
      transform="rotate(30 175 480)"
    />

  </g>


  <!-- ================================= -->
  <!-- SOFT SKY CURVES -->
  <!-- ================================= -->

  <g
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.30"
    stroke-width="3"
  >

    <path
      d="
        M-100 420
        C180 300 350 360 550 250
      "
    />

    <path
      d="
        M1450 450
        C1650 330 1800 400 2020 280
      "
    />

    <path
      d="
        M-100 850
        C160 730 300 800 500 680
      "
    />

  </g>


  <!-- ================================= -->
  <!-- SMALL FLOATING PARTICLES -->
  <!-- ================================= -->

  <g fill="#0284C7">

    <circle cx="530" cy="290" r="5" fill-opacity="0.25"/>
    <circle cx="610" cy="340" r="3" fill-opacity="0.20"/>
    <circle cx="1320" cy="190" r="4" fill-opacity="0.22"/>
    <circle cx="1390" cy="250" r="3" fill-opacity="0.18"/>

    <circle cx="760" cy="850" r="4" fill-opacity="0.20"/>
    <circle cx="820" cy="900" r="3" fill-opacity="0.16"/>

    <circle cx="1500" cy="850" r="5" fill-opacity="0.20"/>
    <circle cx="1560" cy="810" r="3" fill-opacity="0.18"/>

  </g>


  <!-- ================================= -->
  <!-- SMALL STARS -->
  <!-- ================================= -->

  <g
    fill="#FFFFFF"
    fill-opacity="0.55"
  >

    <path d="M590 170L595 183L608 188L595 193L590 206L585 193L572 188L585 183Z"/>

    <path d="M1370 520L1374 531L1385 535L1374 539L1370 550L1366 539L1355 535L1366 531Z"/>

    <path d="M280 720L284 731L295 735L284 739L280 750L276 739L265 735L276 731Z"/>

  </g>

</svg>