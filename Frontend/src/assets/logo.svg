<svg
  width="96"
  height="96"
  viewBox="0 0 96 96"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>

    <!-- Main liquid-glass gradient -->
    <linearGradient
      id="glassGradient"
      x1="12"
      y1="84"
      x2="84"
      y2="12"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#FF7A18"/>
      <stop offset="0.28" stop-color="#A855F7"/>
      <stop offset="0.55" stop-color="#E9D5FF"/>
      <stop offset="0.75" stop-color="#C084FC"/>
      <stop offset="1" stop-color="#FFB86B"/>
    </linearGradient>

    <!-- Bright glass reflection -->
    <linearGradient
      id="reflection"
      x1="20"
      y1="80"
      x2="80"
      y2="20"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.7" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Purple/orange liquid edge -->
    <linearGradient
      id="edge"
      x1="10"
      y1="90"
      x2="90"
      y2="10"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#FF6A00"/>
      <stop offset="0.45" stop-color="#9333EA"/>
      <stop offset="0.75" stop-color="#D8B4FE"/>
      <stop offset="1" stop-color="#FF9D4D"/>
    </linearGradient>

    <!-- Soft purple glow -->
    <filter
      id="purpleGlow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%"
    >
      <feGaussianBlur
        stdDeviation="4"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong liquid glow -->
    <filter
      id="liquidGlow"
      x="-60%"
      y="-60%"
      width="220%"
      height="220%"
    >
      <feGaussianBlur
        stdDeviation="7"
        result="blur"
      />

      <feColorMatrix
        in="blur"
        type="matrix"
        values="
          1 0 0 0 0.35
          0 1 0 0 0.10
          0 0 1 0 0.60
          0 0 0 0.8 0
        "
      />

      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glass blur -->
    <filter id="glassBlur">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>

    <!-- Tiny highlight -->
    <radialGradient id="node">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#E9D5FF"/>
      <stop offset="1" stop-color="#9333EA"/>
    </radialGradient>

  </defs>


  <!-- ================================= -->
  <!-- GLOW BEHIND LOGO -->
  <!-- ================================= -->

  <path
    d="M17 17L79 79"
    stroke="#A855F7"
    stroke-width="15"
    stroke-linecap="round"
    opacity="0.18"
    filter="url(#liquidGlow)"
  />

  <path
    d="M17 79L79 17"
    stroke="#FF7A18"
    stroke-width="18"
    stroke-linecap="round"
    opacity="0.16"
    filter="url(#liquidGlow)"
  />


  <!-- ================================= -->
  <!-- FIRST GLASS TUBE -->
  <!-- ================================= -->

  <!-- dark glass body -->
  <path
    d="M17 17L79 79"
    stroke="#FFFFFF"
    stroke-opacity="0.12"
    stroke-width="13"
    stroke-linecap="round"
  />

  <!-- colored inner liquid -->
  <path
    d="M17 17L79 79"
    stroke="url(#glassGradient)"
    stroke-width="9"
    stroke-linecap="round"
    filter="url(#purpleGlow)"
  />

  <!-- glass edge -->
  <path
    d="M17 17L79 79"
    stroke="url(#edge)"
    stroke-width="10"
    stroke-linecap="round"
    opacity="0.8"
  />

  <!-- center highlight -->
  <path
    d="M17 17L79 79"
    stroke="url(#reflection)"
    stroke-width="3"
    stroke-linecap="round"
  />


  <!-- ================================= -->
  <!-- SECOND GLASS TUBE -->
  <!-- ================================= -->

  <!-- glass body -->
  <path
    d="M17 79L79 17"
    stroke="#FFFFFF"
    stroke-opacity="0.12"
    stroke-width="24"
    stroke-linecap="round"
  />

  <!-- liquid -->
  <path
    d="M17 79L79 17"
    stroke="url(#glassGradient)"
    stroke-width="18"
    stroke-linecap="round"
    filter="url(#purpleGlow)"
  />

  <!-- colored glass edge -->
  <path
    d="M17 79L79 17"
    stroke="url(#edge)"
    stroke-width="18"
    stroke-linecap="round"
    opacity="0.7"
  />

  <!-- bright reflection -->
  <path
    d="M22 74L74 22"
    stroke="url(#reflection)"
    stroke-width="3"
    stroke-linecap="round"
  />


  <!-- ================================= -->
  <!-- DEV TEXT -->
  <!-- ================================= -->

  <text
    x="48"
    y="55"
    transform="rotate(-45 48 55)"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14"
    font-weight="800"
    letter-spacing="0.4"
    fill="#160B22"
  >
    dev
  </text>

  <!-- small glass highlight on text -->
  <text
    x="48"
    y="54"
    transform="rotate(-45 48 54)"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14"
    font-weight="800"
    letter-spacing="0.4"
    fill="#FFFFFF"
    opacity="0.12"
  >
    dev
  </text>


  <!-- ================================= -->
  <!-- GLASS SPECULAR LINE -->
  <!-- ================================= -->

  <path
    d="M34 65L65 34"
    stroke="#FFFFFF"
    stroke-width="1.5"
    stroke-linecap="round"
    opacity="0.5"
  />

  <path
    d="M38 68L68 38"
    stroke="#FFFFFF"
    stroke-width="1"
    stroke-linecap="round"
    opacity="0.18"
  />


  <!-- ================================= -->
  <!-- LIQUID GLASS NODES -->
  <!-- ================================= -->

  <circle
    cx="17"
    cy="17"
    r="5"
    fill="#FFFFFF"
    opacity="0.12"
  />

  <circle
    cx="17"
    cy="17"
    r="3"
    fill="url(#node)"
    filter="url(#purpleGlow)"
  />

  <circle
    cx="79"
    cy="79"
    r="5"
    fill="#FFFFFF"
    opacity="0.12"
  />

  <circle
    cx="79"
    cy="79"
    r="3"
    fill="url(#node)"
  />

  <circle
    cx="17"
    cy="79"
    r="5"
    fill="#FFFFFF"
    opacity="0.12"
  />

  <circle
    cx="17"
    cy="79"
    r="3"
    fill="url(#node)"
  />

  <circle
    cx="79"
    cy="17"
    r="5"
    fill="#FFFFFF"
    opacity="0.12"
  />

  <circle
    cx="79"
    cy="17"
    r="3"
    fill="url(#node)"
  />

</svg>